<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Shield Slam">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D140D"/>
      <stop offset="55%" stop-color="#101A10"/>
      <stop offset="100%" stop-color="#0A120A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3FBF3F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3FBF3F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#8C8C8C"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3FBF3F"/>
      <stop offset="100%" stop-color="#1F7A1F"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <ellipse cx="200" cy="300" rx="420" ry="180" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="#3FBF3F"/>
  <rect x="0" y="316" width="1280" height="4" fill="#1F7A1F"/>

  <!-- shield, cracked -->
  <g transform="translate(96,64)">
    <path d="M96 8 L176 40 V120 C176 172 140 202 96 216 C52 202 16 172 16 120 V40 Z"
          fill="url(#shieldFill)" stroke="#7FE07F" stroke-width="3"/>
    <path d="M96 8 L176 40 V120 C176 172 140 202 96 216 Z" fill="#000000" opacity="0.14"/>
    <!-- crack -->
    <path d="M96 34 L84 92 L112 118 L88 168 L100 196"
          fill="none" stroke="#0D140D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 34 L84 92 L112 118 L88 168 L100 196"
          fill="none" stroke="#0A120A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- mace -->
  <g transform="translate(1108,74) rotate(18)">
    <rect x="-9" y="34" width="18" height="150" rx="6" fill="#6B4A2B" stroke="#3E2A18" stroke-width="3"/>
    <rect x="-13" y="18" width="26" height="24" rx="6" fill="url(#steel)" stroke="#5A5A5A" stroke-width="3"/>
    <circle cx="0" cy="-16" r="42" fill="url(#steel)" stroke="#5A5A5A" stroke-width="3"/>
    <circle cx="0" cy="-16" r="42" fill="#000" opacity="0.08"/>
    <rect x="-52" y="-24" width="20" height="16" rx="5" fill="#D8D8D8" stroke="#5A5A5A" stroke-width="3"/>
    <rect x="32" y="-24" width="20" height="16" rx="5" fill="#D8D8D8" stroke="#5A5A5A" stroke-width="3"/>
    <rect x="-10" y="-68" width="20" height="18" rx="5" fill="#D8D8D8" stroke="#5A5A5A" stroke-width="3"/>
    <rect x="-10" y="34" width="20" height="18" rx="5" fill="#D8D8D8" stroke="#5A5A5A" stroke-width="3"/>
  </g>

  <text x="360" y="152" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="76" font-weight="bold" fill="#FFFFFF" letter-spacing="2">SHIELD<tspan fill="#3FBF3F"> SLAM</tspan></text>
  <text x="364" y="196" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="21" fill="#9FBF9F" letter-spacing="1">Break the shield. Land the smash.</text>

  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="16" fill="#7FA07F">
    <rect x="362" y="222" width="196" height="34" rx="17" fill="#1A2A1A" stroke="#2F5F2F" stroke-width="2"/>
    <text x="460" y="244" text-anchor="middle" fill="#BFDFBF">Minecraft 1.21.11</text>

    <rect x="572" y="222" width="128" height="34" rx="17" fill="#1A2A1A" stroke="#2F5F2F" stroke-width="2"/>
    <text x="636" y="244" text-anchor="middle" fill="#BFDFBF">Fabric</text>

    <rect x="714" y="222" width="178" height="34" rx="17" fill="#1A2A1A" stroke="#2F5F2F" stroke-width="2"/>
    <text x="803" y="244" text-anchor="middle" fill="#BFDFBF">Client-side only</text>
  </g>
</svg>
