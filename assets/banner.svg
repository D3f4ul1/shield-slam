<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Shield Slam">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D140D"/>
      <stop offset="55%" stop-color="#101A10"/>
      <stop offset="100%" stop-color="#0A120A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3FBF3F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3FBF3F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plankA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#63DC63"/>
      <stop offset="100%" stop-color="#2E8B2E"/>
    </linearGradient>
    <linearGradient id="plankB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC64F"/>
      <stop offset="100%" stop-color="#256F25"/>
    </linearGradient>
    <linearGradient id="boss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#8F8F8F"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A5A32"/>
      <stop offset="45%" stop-color="#B37C4A"/>
      <stop offset="100%" stop-color="#6B4423"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#63F7E2"/>
      <stop offset="55%" stop-color="#3FCFBC"/>
      <stop offset="100%" stop-color="#1F8E82"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M18 0 H196 Q216 0 216 20 V118 Q216 176 117 220 Q18 176 18 118 V20 Q18 0 18 0 Z"/>
    </clipPath>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <ellipse cx="200" cy="300" rx="440" ry="185" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="#3FBF3F"/>
  <rect x="0" y="316" width="1280" height="4" fill="#1F7A1F"/>

  <!-- ============ Minecraft shield, green ============ -->
  <g transform="translate(74,46)">
    <path d="M18 0 H196 Q216 0 216 20 V118 Q216 176 117 220 Q18 176 18 118 V20 Q18 0 18 0 Z"
          fill="#256F25"/>
    <g clip-path="url(#shieldClip)">
      <rect x="18" y="0" width="50" height="226" fill="url(#plankA)"/>
      <rect x="68" y="0" width="49" height="226" fill="url(#plankB)"/>
      <rect x="117" y="0" width="49" height="226" fill="url(#plankA)"/>
      <rect x="166" y="0" width="50" height="226" fill="url(#plankB)"/>
      <g stroke="#1B5A1B" stroke-width="3.5" opacity="0.9">
        <line x1="68" y1="0" x2="68" y2="226"/>
        <line x1="117" y1="0" x2="117" y2="226"/>
        <line x1="166" y1="0" x2="166" y2="226"/>
      </g>
      <g stroke="#1B5A1B" stroke-width="1.5" opacity="0.3">
        <line x1="30" y1="0" x2="30" y2="226"/>
        <line x1="86" y1="0" x2="86" y2="226"/>
        <line x1="136" y1="0" x2="136" y2="226"/>
        <line x1="186" y1="0" x2="186" y2="226"/>
      </g>
      <rect x="18" y="0" width="198" height="18" fill="#0A120A" opacity="0.3"/>
      <rect x="18" y="160" width="198" height="66" fill="#0A120A" opacity="0.24"/>
    </g>

    <path d="M18 0 H196 Q216 0 216 20 V118 Q216 176 117 220 Q18 176 18 118 V20 Q18 0 18 0 Z"
          fill="none" stroke="#1B5A1B" stroke-width="10"/>
    <path d="M18 0 H196 Q216 0 216 20 V118 Q216 176 117 220 Q18 176 18 118 V20 Q18 0 18 0 Z"
          fill="none" stroke="#86E886" stroke-width="3" opacity="0.8"/>

    <circle cx="117" cy="102" r="34" fill="url(#boss)" stroke="#6E6E6E" stroke-width="3"/>
    <circle cx="117" cy="102" r="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.5"/>
    <circle cx="117" cy="102" r="10" fill="#7A7A7A" stroke="#5A5A5A" stroke-width="2"/>

    <!-- the split: one clean jagged break. Branching cracks read as limbs, so
         this stays a single line. -->
    <path d="M117 56 L103 98 L125 120 L99 160 L113 204"
          fill="none" stroke="#08110A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M117 56 L103 98 L125 120 L99 160 L113 204"
          fill="none" stroke="#1E5C1E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============ Minecraft axe ============ -->
  <!-- Oriented like the vanilla sprite: handle from lower-left to upper-right,
       head a compact angular wedge at the top, cutting edge on the upper-left. -->
  <g transform="translate(1082,84) scale(1.16)">
    <g transform="rotate(38)">
      <!-- handle -->
      <rect x="-9" y="-18" width="18" height="214" rx="4" fill="url(#handle)" stroke="#3A2716" stroke-width="3"/>
      <rect x="-3" y="-14" width="4" height="200" fill="#C08A55" opacity="0.4"/>
      <rect x="-9" y="176" width="18" height="14" rx="3" fill="#000000" opacity="0.2"/>

      <!-- head: chunky wedge, cutting edge along the upper-left face -->
      <path d="M 20 -52 L -28 -58 L -38 -8 L 8 -4 L 24 -24 Z"
            fill="url(#diamond)" stroke="#14524A" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- cutting edge highlight -->
      <path d="M -28 -58 L -38 -8" fill="none" stroke="#C9FFF7" stroke-opacity="0.95" stroke-width="5"/>
      <path d="M -28 -58 L -38 -8" fill="none" stroke="#2BB3A3" stroke-width="1.5" transform="translate(4.5,0)"/>
      <!-- top face highlight -->
      <path d="M 20 -52 L -28 -58" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"/>
      <!-- socket where the handle passes through -->
      <path d="M -6 -50 L 10 -48 L 12 -12 L -4 -13 Z" fill="#0E3B36" opacity="0.55"/>
    </g>
  </g>

  <text x="352" y="152" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="76" font-weight="bold" fill="#FFFFFF" letter-spacing="2">SHIELD<tspan fill="#3FBF3F"> SLAM</tspan></text>
  <text x="356" y="196" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="21" fill="#9FBF9F" letter-spacing="1">Break the shield. Land the smash.</text>

  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="16">
    <rect x="354" y="222" width="196" height="34" rx="17" fill="#1A2A1A" stroke="#2F5F2F" stroke-width="2"/>
    <text x="452" y="244" text-anchor="middle" fill="#BFDFBF">Minecraft 1.21.11</text>

    <rect x="564" y="222" width="128" height="34" rx="17" fill="#1A2A1A" stroke="#2F5F2F" stroke-width="2"/>
    <text x="628" y="244" text-anchor="middle" fill="#BFDFBF">Fabric</text>

    <rect x="706" y="222" width="178" height="34" rx="17" fill="#1A2A1A" stroke="#2F5F2F" stroke-width="2"/>
    <text x="795" y="244" text-anchor="middle" fill="#BFDFBF">Client-side only</text>
  </g>
</svg>
