<svg xmlns="http://www.w3.org/2000/svg" width="900" height="508" viewBox="0 0 450 254" role="img" aria-label="The Shield Slam settings panel">
  <defs>
    <linearGradient id="world" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5C7A5C"/>
      <stop offset="45%" stop-color="#4A6B7A"/>
      <stop offset="100%" stop-color="#2E3D2E"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E7E7E"/>
      <stop offset="48%" stop-color="#6C6C6C"/>
      <stop offset="52%" stop-color="#5F5F5F"/>
      <stop offset="100%" stop-color="#565656"/>
    </linearGradient>
    <linearGradient id="btnGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FAF8F"/>
      <stop offset="48%" stop-color="#7A9E7A"/>
      <stop offset="52%" stop-color="#6B8F6B"/>
      <stop offset="100%" stop-color="#5E805E"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#2E2E2E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <style>
      .lbl { font-family: Verdana,Geneva,DejaVu Sans,sans-serif; font-size:7px; fill:#FFFFFF; text-anchor:middle; }
      .hdr { font-family: Verdana,Geneva,DejaVu Sans,sans-serif; font-size:7px; font-weight:bold; fill:#3FBF3F; text-anchor:middle; letter-spacing:0.4px; }
      .title { font-family: Verdana,Geneva,DejaVu Sans,sans-serif; font-size:9px; font-weight:bold; fill:#3FBF3F; text-anchor:middle; letter-spacing:1px; }
      .status { font-family: Verdana,Geneva,DejaVu Sans,sans-serif; font-size:7.5px; font-weight:bold; fill:#3FBF3F; text-anchor:middle; letter-spacing:0.6px; }
    </style>
  </defs>

  <!-- simulated blurred in-game world behind the panel -->
  <rect width="450" height="254" fill="url(#world)"/>
  <g opacity="0.35">
    <rect x="0" y="150" width="450" height="104" fill="#3A4A32"/>
    <rect x="40" y="120" width="60" height="40" fill="#6B8F5A"/>
    <rect x="320" y="104" width="80" height="56" fill="#5E7F52"/>
    <rect x="180" y="132" width="46" height="28" fill="#7A9E68"/>
  </g>
  <rect width="450" height="254" fill="#0A0F0A" opacity="0.45"/>

  <g transform="translate(20,20)" filter="url(#shadow)">
    <!-- panel body: #101A10 at ~72% opacity, as drawn over the blurred world -->
    <rect x="0" y="0" width="410" height="214" fill="#101A10" fill-opacity="0.72"/>
    <rect x="0" y="0" width="410" height="214" fill="none" stroke="#3FBF3F" stroke-width="2"/>

    <text class="title" x="205" y="17">&#10006; SHIELD SLAM &#10006;</text>
    <line x1="20" y1="28" x2="390" y2="28" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="1"/>
    <text class="status" x="205" y="44">STUN SLAM</text>

    <!-- column headers -->
    <text class="hdr" x="107.5" y="64">STUN SLAM</text>
    <text class="hdr" x="302.5" y="64">SHIELD BREAK</text>

    <!-- ===== left column: stun slam ===== -->
    <!-- row 1: master switch (on) -->
    <rect x="20" y="76" width="175" height="20" rx="1" fill="url(#btnGreen)" stroke="#2B2B2B" stroke-width="1"/>
    <rect x="21" y="77" width="173" height="1" fill="#FFFFFF" fill-opacity="0.22"/>
    <text class="lbl" x="107.5" y="89.5">Stun Slam: ON</text>

    <!-- row 2: delay slider at 100ms = 20% -->
    <rect x="20" y="100" width="175" height="20" rx="1" fill="url(#track)" stroke="#2B2B2B" stroke-width="1"/>
    <rect x="20" y="100" width="35" height="20" fill="#3FBF3F" fill-opacity="0.28"/>
    <rect x="55" y="100" width="8" height="20" rx="1" fill="url(#btn)" stroke="#2B2B2B" stroke-width="1"/>
    <text class="lbl" x="107.5" y="113.5">Delay: 100 ms</text>

    <!-- row 3: min fall slider at 1.5/6 = 25% -->
    <rect x="20" y="124" width="175" height="20" rx="1" fill="url(#track)" stroke="#2B2B2B" stroke-width="1"/>
    <rect x="20" y="124" width="43.75" height="20" fill="#3FBF3F" fill-opacity="0.28"/>
    <rect x="63.75" y="124" width="8" height="20" rx="1" fill="url(#btn)" stroke="#2B2B2B" stroke-width="1"/>
    <text class="lbl" x="107.5" y="137.5">Min fall: 1.5 blocks</text>

    <!-- row 4: mace type -->
    <rect x="20" y="148" width="175" height="20" rx="1" fill="url(#btn)" stroke="#2B2B2B" stroke-width="1"/>
    <rect x="21" y="149" width="173" height="1" fill="#FFFFFF" fill-opacity="0.22"/>
    <text class="lbl" x="107.5" y="161.5">Mace: ANY</text>

    <!-- ===== right column: shield break ===== -->
    <!-- row 1: shield break switch (on) -->
    <rect x="215" y="76" width="175" height="20" rx="1" fill="url(#btnGreen)" stroke="#2B2B2B" stroke-width="1"/>
    <rect x="216" y="77" width="173" height="1" fill="#FFFFFF" fill-opacity="0.22"/>
    <text class="lbl" x="302.5" y="89.5">Shield break: ON</text>

    <!-- row 2: break delay slider at 100ms = 20% -->
    <rect x="215" y="100" width="175" height="20" rx="1" fill="url(#track)" stroke="#2B2B2B" stroke-width="1"/>
    <rect x="215" y="100" width="35" height="20" fill="#3FBF3F" fill-opacity="0.28"/>
    <rect x="250" y="100" width="8" height="20" rx="1" fill="url(#btn)" stroke="#2B2B2B" stroke-width="1"/>
    <text class="lbl" x="302.5" y="113.5">Break delay: 100 ms</text>

    <!-- row 3: break key -->
    <rect x="215" y="124" width="175" height="20" rx="1" fill="url(#btn)" stroke="#2B2B2B" stroke-width="1"/>
    <rect x="216" y="125" width="173" height="1" fill="#FFFFFF" fill-opacity="0.22"/>
    <text class="lbl" x="302.5" y="137.5">Break key: V</text>

    <!-- close -->
    <rect x="20" y="176" width="370" height="20" rx="1" fill="url(#btn)" stroke="#2B2B2B" stroke-width="1"/>
    <rect x="21" y="177" width="368" height="1" fill="#FFFFFF" fill-opacity="0.22"/>
    <text class="lbl" x="205" y="189.5">Close</text>
  </g>
</svg>
